<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2인용 퐁</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1e1e2e;
    color: #fff;
    font-family: sans-serif;
  }
  canvas { background: #11111b; border: 4px solid #89b4fa; border-radius: 8px; max-width: 95vw; }
  button { font-size: 16px; padding: 8px 16px; margin: 6px; border: 0; border-radius: 6px; cursor: pointer; }
  .p1 { color: #89b4fa; }
  .p2 { color: #fab387; }
  #commentary { min-height: 1.5em; font-size: 18px; color: #a6e3a1; text-align: center; padding: 0 12px; }
</style>
</head>
<body>
  <h1>🏓 2인용 퐁</h1>
  <canvas id="board" width="600" height="400"></canvas>
  <div><button id="restart">다시 시작</button></div>
  <p><span class="p1">나(왼쪽): W / S 또는 ↑ / ↓</span> &nbsp; <span class="p2">AI(오른쪽): 자동</span></p>
  <p>공을 놓치면 상대가 1점! 먼저 5점을 얻으면 이겨요. 스페이스바를 누르면 시작해요.</p>
  <p id="commentary"></p>

<script>
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const PADDLE_W = 12, PADDLE_H = 80, BALL = 10, WIN_SCORE = 5;
  const AI_SPEED = 4;  // 숫자를 키우면 AI가 더 강해져요

  const left  = { x: 20,             y: H / 2 - PADDLE_H / 2, color: "#89b4fa", score: 0 };
  const right = { x: W - 20 - PADDLE_W, y: H / 2 - PADDLE_H / 2, color: "#fab387", score: 0 };
  const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
  const held = {};       // 지금 눌려 있는 키들
  let running = false;   // 공이 움직이는 중인지
  let message = "스페이스바를 눌러 시작!";
  let hits = 0;          // 이번 게임에서 공이 패들에 맞은 횟수(핑퐁 횟수)
  const commentaryEl = document.getElementById("commentary");

  // 게임이 끝나면 승자와 핑퐁 횟수를 서버(/api/commentary)로 보내 AI 해설 한 줄을 받아와요.
  // 비밀 키는 서버에만 있고, 이 파일에는 없어요.
  let gameId = 0;        // 게임이 새로 시작/리셋될 때마다 올라가는 번호 (낡은 해설 구분용)

  async function showCommentary(winner) {
    const myGame = gameId;
    if (location.protocol === "file:") {
      commentaryEl.textContent = "배포하면 AI 해설이 나옵니다";
      return;
    }
    commentaryEl.textContent = "AI 해설 작성 중…";
    try {
      const res = await fetch("/api/commentary", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ winner, hits })
      });
      const data = await res.json();
      // 그 사이 새 게임을 시작했다면 낡은 해설은 보여주지 않아요
      if (myGame !== gameId) return;
      commentaryEl.textContent = data.comment || "";
    } catch (e) {
      commentaryEl.textContent = "";
    }
  }

  function serve(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    const angle = (Math.random() * 0.8 - 0.4);  // 위아래로 살짝 랜덤하게
    ball.vx = 5 * direction * Math.cos(angle);
    ball.vy = 5 * Math.sin(angle);
  }

  function reset() {
    left.score = right.score = 0;
    left.y = right.y = H / 2 - PADDLE_H / 2;
    ball.vx = ball.vy = 0;
    ball.x = W / 2; ball.y = H / 2;
    running = false;
    hits = 0;
    gameId++;
    commentaryEl.textContent = "";
    message = "스페이스바를 눌러 시작!";
  }

  function hitPaddle(p) {
    return ball.x - BALL / 2 < p.x + PADDLE_W && ball.x + BALL / 2 > p.x &&
           ball.y + BALL / 2 > p.y && ball.y - BALL / 2 < p.y + PADDLE_H;
  }

  function update() {
    // 패들 이동
    if (held["w"] || held["ArrowUp"]) left.y -= 6;
    if (held["s"] || held["ArrowDown"]) left.y += 6;
    // 오른쪽 패들은 AI: 공이 자기 쪽으로 올 때만 공의 높이를 따라가요.
    // 속도(AI_SPEED)가 사람(6)보다 느려서 빠른 공은 놓칠 수 있어요.
    if (running && ball.vx > 0) {
      const target = ball.y - PADDLE_H / 2;
      const diff = target - right.y;
      if (Math.abs(diff) > 8) right.y += Math.sign(diff) * AI_SPEED;
    }
    left.y = Math.max(0, Math.min(H - PADDLE_H, left.y));
    right.y = Math.max(0, Math.min(H - PADDLE_H, right.y));

    if (!running) return;

    ball.x += ball.vx;
    ball.y += ball.vy;

    // 위/아래 벽에 튕기기
    if (ball.y < BALL / 2 || ball.y > H - BALL / 2) ball.vy *= -1;

    // 패들에 맞으면 튕기고 조금 빨라짐. 맞은 위치에 따라 각도가 달라짐
    [left, right].forEach(p => {
      if (hitPaddle(p)) {
        const hitPos = (ball.y - (p.y + PADDLE_H / 2)) / (PADDLE_H / 2);  // -1 ~ 1
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.4, 12);
        const dir = p === left ? 1 : -1;
        ball.vx = dir * speed * Math.cos(hitPos * 0.9);
        ball.vy = speed * Math.sin(hitPos * 0.9);
        ball.x = p === left ? p.x + PADDLE_W + BALL / 2 : p.x - BALL / 2;
        hits++;
      }
    });

    // 공이 좌우로 나가면 점수
    if (ball.x < 0) point(right, 1);
    else if (ball.x > W) point(left, -1);
  }

  function point(scorer, nextDir) {
    scorer.score++;
    if (scorer.score >= WIN_SCORE) {
      running = false;
      ball.vx = ball.vy = 0;
      message = (scorer === left ? "내가" : "AI가") + " 승리! 🎉 (스페이스바: 다시 시작)";
      showCommentary(scorer === left ? "me" : "ai");
    } else {
      serve(nextDir);  // 점수를 잃은 쪽으로 공을 보냄
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // 가운데 점선
    ctx.fillStyle = "#45475a";
    for (let y = 0; y < H; y += 24) ctx.fillRect(W / 2 - 2, y, 4, 12);
    // 패들
    [left, right].forEach(p => {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, PADDLE_W, PADDLE_H);
    });
    // 공
    ctx.fillStyle = "#fff";
    ctx.fillRect(ball.x - BALL / 2, ball.y - BALL / 2, BALL, BALL);
    // 점수
    ctx.font = "40px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = left.color;  ctx.fillText(left.score, W / 2 - 60, 50);
    ctx.fillStyle = right.color; ctx.fillText(right.score, W / 2 + 60, 50);
    // 안내 문구
    if (!running) {
      ctx.fillStyle = "#fff";
      ctx.font = "22px sans-serif";
      ctx.fillText(message, W / 2, H - 30);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener("keydown", e => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (["w", "s", "ArrowUp", "ArrowDown", " "].includes(key)) e.preventDefault();
    held[key] = true;
    if (key === " " && !running) {
      if (left.score >= WIN_SCORE || right.score >= WIN_SCORE) reset();
      running = true;
      gameId++;
      commentaryEl.textContent = "";
      serve(Math.random() < 0.5 ? 1 : -1);
    }
  });
  document.addEventListener("keyup", e => {
    held[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
  });
  document.getElementById("restart").addEventListener("click", reset);

  loop();
</script>
</body>
</html>
